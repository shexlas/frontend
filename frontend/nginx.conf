# Serves the built SPA and reverse-proxies API/media calls to the backend
# container over the internal Docker network, so the browser only ever
# talks to a single origin. That sidesteps CORS entirely in production and
# avoids third-party-cookie restrictions some browsers apply to auth
# cookies when the frontend and API live on different origins.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Video uploads can be large (up to 8GB, see backend/src/middleware/upload.js).
    client_max_body_size 8192m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Hashed, content-addressed build assets (Vite's default) never change
    # content for a given filename, so they're safe to cache indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large video uploads and long streaming responses need generous timeouts.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: let React Router handle any route that isn't a real file.
    location / {
        try_files $uri /index.html;
    }
}
